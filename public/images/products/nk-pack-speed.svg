<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Grid -->
  <g stroke="#10b981" stroke-width="0.2" opacity="0.15">
    <line x1="67" y1="0" x2="67" y2="600"/>
    <line x1="134" y1="0" x2="134" y2="600"/>
    <line x1="201" y1="0" x2="201" y2="600"/>
    <line x1="268" y1="0" x2="268" y2="600"/>
    <line x1="335" y1="0" x2="335" y2="600"/>
    <line x1="402" y1="0" x2="402" y2="600"/>
    <line x1="469" y1="0" x2="469" y2="600"/>
    <line x1="536" y1="0" x2="536" y2="600"/>
    <line x1="603" y1="0" x2="603" y2="600"/>
    <line x1="670" y1="0" x2="670" y2="600"/>
    <line x1="737" y1="0" x2="737" y2="600"/>
    <line x1="0" y1="67" x2="800" y2="67"/>
    <line x1="0" y1="134" x2="800" y2="134"/>
    <line x1="0" y1="201" x2="800" y2="201"/>
    <line x1="0" y1="268" x2="800" y2="268"/>
    <line x1="0" y1="335" x2="800" y2="335"/>
    <line x1="0" y1="402" x2="800" y2="402"/>
    <line x1="0" y1="469" x2="800" y2="469"/>
  </g>

  <!-- Glow -->
  <circle cx="400" cy="240" r="210" fill="#10b981" opacity="0.06" filter="url(#glow)"/>

  <!-- ============ Core Web Vitals gauges ============ -->
  <g font-family="sans-serif">
    <rect x="60" y="46" width="680" height="72" rx="8" fill="#0d2d24" stroke="#10b981" stroke-width="1"/>

    <text x="78" y="70" fill="#6ee7b7" font-size="11" font-weight="bold">CORE WEB VITALS</text>

    <!-- LCP -->
    <text x="78" y="94" fill="#f0fdf4" font-size="12" font-weight="bold">LCP</text>
    <rect x="116" y="85" width="130" height="8" rx="4" fill="#10b981" opacity="0.18"/>
    <rect x="116" y="85" width="96" height="8" rx="4" fill="#10b981"/>
    <text x="256" y="94" fill="#6ee7b7" font-size="10">1.8 s</text>

    <!-- CLS -->
    <text x="316" y="94" fill="#f0fdf4" font-size="12" font-weight="bold">CLS</text>
    <rect x="354" y="85" width="130" height="8" rx="4" fill="#10b981" opacity="0.18"/>
    <rect x="354" y="85" width="42" height="8" rx="4" fill="#10b981"/>
    <text x="494" y="94" fill="#6ee7b7" font-size="10">0.03</text>

    <!-- INP -->
    <text x="556" y="94" fill="#f0fdf4" font-size="12" font-weight="bold">INP</text>
    <rect x="594" y="85" width="96" height="8" rx="4" fill="#10b981" opacity="0.18"/>
    <rect x="594" y="85" width="58" height="8" rx="4" fill="#10b981"/>
    <text x="700" y="94" fill="#6ee7b7" font-size="10">140 ms</text>
  </g>

  <!-- ============ Left: lazy-loaded product grid ============ -->
  <g font-family="sans-serif">
    <rect x="60" y="138" width="360" height="240" rx="8" fill="#0d2d24" stroke="#10b981" stroke-width="1"/>
    <text x="78" y="162" fill="#6ee7b7" font-size="11" font-weight="bold">LAZY IMAGES</text>

    <!-- Above the fold: eager -->
    <rect x="78" y="176" width="76" height="60" rx="4" fill="#10b981" opacity="0.55"/>
    <rect x="164" y="176" width="76" height="60" rx="4" fill="#10b981" opacity="0.55"/>
    <rect x="250" y="176" width="76" height="60" rx="4" fill="#10b981" opacity="0.55"/>
    <rect x="336" y="176" width="66" height="60" rx="4" fill="#10b981" opacity="0.55"/>
    <text x="78" y="250" fill="#6ee7b7" font-size="9">eager — first row, holds the LCP</text>

    <!-- Fold line -->
    <line x1="78" y1="262" x2="402" y2="262" stroke="#10b981" stroke-width="1" stroke-dasharray="5 4" opacity="0.7"/>
    <text x="402" y="258" fill="#10b981" font-size="8" font-weight="bold" text-anchor="end">FOLD</text>

    <!-- Below the fold: lazy -->
    <rect x="78" y="274" width="76" height="60" rx="4" fill="none" stroke="#10b981" stroke-width="1" stroke-dasharray="4 3" opacity="0.6"/>
    <rect x="164" y="274" width="76" height="60" rx="4" fill="none" stroke="#10b981" stroke-width="1" stroke-dasharray="4 3" opacity="0.6"/>
    <rect x="250" y="274" width="76" height="60" rx="4" fill="none" stroke="#10b981" stroke-width="1" stroke-dasharray="4 3" opacity="0.6"/>
    <rect x="336" y="274" width="66" height="60" rx="4" fill="none" stroke="#10b981" stroke-width="1" stroke-dasharray="4 3" opacity="0.6"/>
    <text x="78" y="352" fill="#94a3b8" font-size="9">loading="lazy"  decoding="async"</text>
    <text x="78" y="368" fill="#94a3b8" font-size="9">+ infinite scroll appends page 2, 3, 4…</text>
  </g>

  <!-- ============ Right: asset bundling ============ -->
  <g font-family="sans-serif">
    <rect x="440" y="138" width="300" height="240" rx="8" fill="#0d2d24" stroke="#10b981" stroke-width="1"/>
    <text x="458" y="162" fill="#6ee7b7" font-size="11" font-weight="bold">ASSET BUNDLES</text>

    <!-- Source files -->
    <rect x="458" y="176" width="112" height="22" rx="4" fill="#0a1f17" stroke="#10b981" stroke-width="0.8"/>
    <text x="468" y="191" fill="#94a3b8" font-size="9">bootstrap.css</text>
    <rect x="458" y="204" width="112" height="22" rx="4" fill="#0a1f17" stroke="#10b981" stroke-width="0.8"/>
    <text x="468" y="219" fill="#94a3b8" font-size="9">stylesheet.css</text>
    <rect x="458" y="232" width="112" height="22" rx="4" fill="#0a1f17" stroke="#10b981" stroke-width="0.8"/>
    <text x="468" y="247" fill="#94a3b8" font-size="9">theme.css</text>
    <rect x="458" y="260" width="112" height="22" rx="4" fill="#0a1f17" stroke="#10b981" stroke-width="0.8"/>
    <text x="468" y="275" fill="#94a3b8" font-size="9">all.min.css</text>

    <!-- Arrows -->
    <g stroke="#10b981" stroke-width="1.2" opacity="0.75" fill="none">
      <path d="M574 187 C 600 187, 604 218, 626 226"/>
      <path d="M574 215 C 598 215, 604 222, 626 226"/>
      <path d="M574 243 C 598 243, 604 230, 626 226"/>
      <path d="M574 271 C 600 271, 604 234, 626 226"/>
    </g>
    <path d="M626 222 l8 4 l-8 4 z" fill="#10b981"/>

    <!-- Bundle -->
    <rect x="638" y="196" width="86" height="60" rx="6" fill="#10b981" opacity="0.16"/>
    <rect x="638" y="196" width="86" height="60" rx="6" fill="none" stroke="#10b981" stroke-width="1.2"/>
    <text x="681" y="220" fill="#6ee7b7" font-size="10" font-weight="bold" text-anchor="middle">1 bundle</text>
    <text x="681" y="236" fill="#94a3b8" font-size="8" text-anchor="middle">nk-speed.</text>
    <text x="681" y="247" fill="#94a3b8" font-size="8" text-anchor="middle">a3f9…css</text>

    <text x="458" y="304" fill="#94a3b8" font-size="9">concat + conservative minify, cached</text>
    <text x="458" y="320" fill="#94a3b8" font-size="9">hash filenames bust every browser cache</text>
    <text x="458" y="336" fill="#94a3b8" font-size="9">*.min files bundled verbatim, never</text>
    <text x="458" y="352" fill="#94a3b8" font-size="9">re-minified — every rewrite fails open</text>
    <text x="458" y="368" fill="#10b981" font-size="9" font-weight="bold">Cache-Control: immutable + ETag/304</text>
  </g>

  <!-- ============ Feature pills ============ -->
  <g font-size="9" font-weight="bold" font-family="sans-serif">
    <rect x="60" y="400" width="126" height="26" rx="13" fill="#10b981" opacity="0.12"/>
    <text x="123" y="417" fill="#6ee7b7" text-anchor="middle">LAZY LOADING</text>
    <rect x="198" y="400" width="126" height="26" rx="13" fill="#10b981" opacity="0.12"/>
    <text x="261" y="417" fill="#6ee7b7" text-anchor="middle">CSS/JS BUNDLES</text>
    <rect x="336" y="400" width="126" height="26" rx="13" fill="#10b981" opacity="0.12"/>
    <text x="399" y="417" fill="#6ee7b7" text-anchor="middle">INFINITE SCROLL</text>
    <rect x="474" y="400" width="126" height="26" rx="13" fill="#10b981" opacity="0.12"/>
    <text x="537" y="417" fill="#6ee7b7" text-anchor="middle">GZIP + CACHING</text>
    <rect x="612" y="400" width="128" height="26" rx="13" fill="#10b981" opacity="0.12"/>
    <text x="676" y="417" fill="#6ee7b7" text-anchor="middle">CWV REPORT</text>
  </g>

  <!-- ============ Label bar ============ -->
  <rect x="0" y="500" width="800" height="100" fill="#161b22"/>
  <rect x="0" y="500" width="800" height="3" fill="#10b981"/>

  <text x="30" y="536" fill="#f0fdf4" font-size="22" font-weight="bold" font-family="sans-serif">Speed Optimization Pack</text>
  <text x="30" y="558" fill="#94a3b8" font-size="12" font-family="sans-serif">Storefront performance layer for OpenCart 4.x</text>

  <rect x="670" y="516" width="100" height="34" rx="6" fill="#1a3a2a"/>
  <text x="720" y="539" fill="#10b981" font-size="15" font-weight="bold" text-anchor="middle" font-family="sans-serif">$59</text>

  <rect x="30" y="568" width="60" height="16" rx="4" fill="#10b981" opacity="0.15"/>
  <text x="60" y="580" fill="#10b981" font-size="9" font-weight="bold" text-anchor="middle" font-family="sans-serif">MODULE</text>

  <rect x="98" y="568" width="48" height="16" rx="4" fill="#10b981" opacity="0.15"/>
  <text x="122" y="580" fill="#10b981" font-size="9" font-weight="bold" text-anchor="middle" font-family="sans-serif">PACK</text>
</svg>
