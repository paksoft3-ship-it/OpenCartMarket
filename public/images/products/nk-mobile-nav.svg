  <rect x="306" y="126" width="188" height="26" rx="5" fill="#0d2d24" stroke="#10b981" stroke-width="0.7"/>
  <circle cx="320" cy="139" r="5" fill="none" stroke="#10b981" stroke-width="1.3"/>
  <rect x="306" y="164" width="90" height="90" rx="5" fill="#0d2d24" stroke="#10b981" stroke-width="0.7"/>
  <rect x="404" y="164" width="90" height="90" rx="5" fill="#0d2d24" stroke="#10b981" stroke-width="0.7"/>
  <rect x="306" y="266" width="90" height="90" rx="5" fill="#0d2d24" stroke="#10b981" stroke-width="0.7"/>
