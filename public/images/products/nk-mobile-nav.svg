  <path d="M310 438l10-8 10 8v13h-6v-8h-8v8h-6z" fill="none" stroke="#10b981" stroke-width="1.6" stroke-linejoin="round"/>
  <text x="320" y="466" fill="#10b981" font-size="7.5" text-anchor="middle" font-family="sans-serif">Home</text>

  <!-- categories -->
  <rect x="352" y="431" width="8" height="8" rx="1.5" fill="none" stroke="#6ee7b7" stroke-width="1.5"/>
  <rect x="364" y="431" width="8" height="8" rx="1.5" fill="none" stroke="#6ee7b7" stroke-width="1.5"/>
  <rect x="352" y="443" width="8" height="8" rx="1.5" fill="none" stroke="#6ee7b7" stroke-width="1.5"/>
  <rect x="364" y="443" width="8" height="8" rx="1.5" fill="none" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="362" y="466" fill="#6ee7b7" font-size="7.5" text-anchor="middle" font-family="sans-serif">Categories</text>

