  <text x="570" y="256" fill="#f0fdf4" font-size="12" font-weight="bold" font-family="sans-serif">Categories</text>
  <text x="730" y="257" fill="#6ee7b7" font-size="15" text-anchor="end" font-family="sans-serif">x</text>
  <line x1="552" y1="268" x2="748" y2="268" stroke="#10b981" stroke-width="0.6" opacity="0.35"/>
  <text x="570" y="290" fill="#6ee7b7" font-size="11" font-family="sans-serif">Components <tspan opacity="0.55">(24)</tspan></text>
  <line x1="552" y1="302" x2="748" y2="302" stroke="#10b981" stroke-width="0.5" opacity="0.2"/>
  <text x="570" y="324" fill="#6ee7b7" font-size="11" font-family="sans-serif">Laptops <tspan opacity="0.55">(18)</tspan></text>
  <line x1="552" y1="336" x2="748" y2="336" stroke="#10b981" stroke-width="0.5" opacity="0.2"/>
  <text x="570" y="358" fill="#6ee7b7" font-size="11" font-family="sans-serif">Cameras <tspan opacity="0.55">(9)</tspan></text>
  <line x1="552" y1="370" x2="748" y2="370" stroke="#10b981" stroke-width="0.5" opacity="0.2"/>
  <text x="570" y="392" fill="#6ee7b7" font-size="11" font-family="sans-serif">Phones <tspan opacity="0.55">(31)</tspan></text>
  <line x1="552" y1="404" x2="748" y2="404" stroke="#10b981" stroke-width="0.5" opacity="0.2"/>
  <text x="570" y="426" fill="#6ee7b7" font-size="11" font-family="sans-serif">Software <tspan opacity="0.55">(6)</tspan></text>
  <line x1="552" y1="438" x2="748" y2="438" stroke="#10b981" stroke-width="0.5" opacity="0.2"/>
  <text x="570" y="460" fill="#6ee7b7" font-size="11" font-family="sans-serif">Tablets <tspan opacity="0.55">(12)</tspan></text>
  <path d="M640 214l10-12 10 12" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>

  <!-- desktop-hidden note -->
  <rect x="52" y="230" width="196" height="90" rx="10" fill="#0d2d24" stroke="#10b981" stroke-width="1" opacity="0.55"/>
  <text x="150" y="266" fill="#6ee7b7" font-size="12" text-anchor="middle" font-family="sans-serif" opacity="0.9">Desktop</text>
  <text x="150" y="290" fill="#10b981" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">bar hidden</text>
  <text x="150" y="308" fill="#6ee7b7" font-size="9.5" text-anchor="middle" font-family="sans-serif" opacity="0.7">above 768px</text>

  <!-- Label area -->
  <rect x="0" y="525" width="800" height="75" fill="#161b22"/>
  <rect x="0" y="525" width="800" height="3" fill="#10b981"/>

  <text x="30" y="552" fill="#f0fdf4" font-size="22" font-weight="bold" font-family="sans-serif">NovaKur Mobile Bottom Nav</text>

  <rect x="680" y="535" width="90" height="30" rx="6" fill="#1a3a2a"/><text x="725" y="556" fill="#10b981" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">$24</text>

  <rect x="30" y="562" width="60" height="16" rx="4" fill="#10b981" opacity="0.15"/>
  <text x="60" y="574" fill="#10b981" font-size="9" font-weight="bold" text-anchor="middle" font-family="sans-serif">MODULE</text>
