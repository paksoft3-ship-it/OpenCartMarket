  <text x="444" y="466" fill="#6ee7b7" font-size="7.5" text-anchor="middle" font-family="sans-serif">Cart</text>

  <!-- account -->
  <circle cx="486" cy="436" r="4.5" fill="none" stroke="#6ee7b7" stroke-width="1.6"/>
  <path d="M479 452a7.5 7.5 0 0 1 14 0" fill="none" stroke="#6ee7b7" stroke-width="1.6" stroke-linecap="round"/>
  <text x="486" y="466" fill="#6ee7b7" font-size="7.5" text-anchor="middle" font-family="sans-serif">Account</text>

  <!-- safe area indicator -->
  <rect x="366" y="481" width="68" height="3.5" rx="1.75" fill="#10b981" opacity="0.35"/>

