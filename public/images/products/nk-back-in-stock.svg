<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Grid lines -->
  <line x1="0" y1="0" x2="0" y2="600" stroke="#f59e0b" stroke-width="0.2" opacity="0.15"/>
  <line x1="67" y1="0" x2="67" y2="600" stroke="#f59e0b" stroke-width="0.2" opacity="0.15"/>
  <line x1="134" y1="0" x2="134" y2="600" stroke="#f59e0b" stroke-width="0.2" opacity="0.15"/>
  <line x1="201" y1="0" x2="201" y2="600" stroke="#f59e0b" stroke-width="0.2" opacity="0.15"/>
  <line x1="268" y1="0" x2="268" y2="600" stroke="#f59e0b" stroke-width="0.2" opacity="0.15"/>
  <line x1="335" y1="0" x2="335" y2="600" stroke="#f59e0b" stroke-width="0.2" opacity="0.15"/>
  <line x1="402" y1="0" x2="402" y2="600" stroke="#f59e0b" stroke-width="0.2" opacity="0.15"/>
  <line x1="469" y1="0" x2="469" y2="600" stroke="#f59e0b" stroke-width="0.2" opacity="0.15"/>
  <line x1="536" y1="0" x2="536" y2="600" stroke="#f59e0b" stroke-width="0.2" opacity="0.15"/>
  <line x1="603" y1="0" x2="603" y2="600" stroke="#f59e0b" stroke-width="0.2" opacity="0.15"/>
  <line x1="670" y1="0" x2="670" y2="600" stroke="#f59e0b" stroke-width="0.2" opacity="0.15"/>
  <line x1="737" y1="0" x2="737" y2="600" stroke="#f59e0b" stroke-width="0.2" opacity="0.15"/>
  <line x1="0" y1="0" x2="800" y2="0" stroke="#f59e0b" stroke-width="0.2" opacity="0.15"/>
  <line x1="0" y1="67" x2="800" y2="67" stroke="#f59e0b" stroke-width="0.2" opacity="0.15"/>
  <line x1="0" y1="134" x2="800" y2="134" stroke="#f59e0b" stroke-width="0.2" opacity="0.15"/>
  <line x1="0" y1="201" x2="800" y2="201" stroke="#f59e0b" stroke-width="0.2" opacity="0.15"/>
  <line x1="0" y1="268" x2="800" y2="268" stroke="#f59e0b" stroke-width="0.2" opacity="0.15"/>
  <line x1="0" y1="335" x2="800" y2="335" stroke="#f59e0b" stroke-width="0.2" opacity="0.15"/>
  <line x1="0" y1="402" x2="800" y2="402" stroke="#f59e0b" stroke-width="0.2" opacity="0.15"/>
  <line x1="0" y1="469" x2="800" y2="469" stroke="#f59e0b" stroke-width="0.2" opacity="0.15"/>
  <line x1="0" y1="536" x2="800" y2="536" stroke="#f59e0b" stroke-width="0.2" opacity="0.15"/>

  <!-- Glow orb -->
  <circle cx="400" cy="250" r="200" fill="#f59e0b" opacity="0.06" filter="url(#glow)"/>

  <!-- Product panel -->
  <rect x="120" y="110" width="560" height="250" rx="12" fill="#2a1c05" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="140" y="130" width="170" height="170" rx="6" fill="#1c1304"/>
  <rect x="166" y="176" width="118" height="78" rx="6" fill="#3a2708"/>
  <circle cx="225" cy="215" r="24" fill="#f59e0b" opacity="0.6"/>

  <rect x="330" y="130" width="250" height="18" rx="3" fill="#3a2708"/>
  <rect x="330" y="158" width="170" height="10" rx="2" fill="#3a2708"/>

  <!-- out of stock badge + disabled add to cart -->
  <rect x="330" y="182" width="130" height="24" rx="5" fill="#7f1d1d"/>
  <text x="395" y="199" fill="#fecaca" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">OUT OF STOCK</text>
  <rect x="330" y="216" width="180" height="26" rx="5" fill="#3a2708" opacity="0.7"/>
  <text x="420" y="234" fill="#8a7a5a" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">Add to Cart</text>

  <!-- notify form -->
  <rect x="330" y="252" width="330" height="86" rx="8" fill="#1c1304" stroke="#f59e0b" stroke-width="1"/>
  <text x="346" y="274" fill="#fde68a" font-size="11" font-weight="bold" font-family="sans-serif">Get an e-mail when it is back</text>
  <rect x="346" y="286" width="196" height="30" rx="5" fill="#2a1c05" stroke="#5a4212" stroke-width="1"/>
  <text x="358" y="306" fill="#a08a5a" font-size="11" font-family="sans-serif">you@example.com</text>
  <rect x="550" y="286" width="96" height="30" rx="5" fill="#f59e0b"/>
  <text x="598" y="306" fill="#1c1304" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">Notify me</text>

  <!-- flow strip -->
  <rect x="120" y="380" width="560" height="100" rx="10" fill="#161b22" stroke="#3a2708" stroke-width="1"/>
  <rect x="142" y="404" width="140" height="52" rx="8" fill="#2a1c05"/>
  <text x="212" y="428" fill="#fde68a" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">stock returns</text>
  <text x="212" y="445" fill="#a08a5a" font-size="10" text-anchor="middle" font-family="sans-serif">quantity &gt; 0</text>

  <text x="300" y="437" fill="#f59e0b" font-size="20" font-weight="bold" text-anchor="middle" font-family="sans-serif">&#8594;</text>

  <rect x="330" y="404" width="140" height="52" rx="8" fill="#2a1c05"/>
  <text x="400" y="428" fill="#fde68a" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">cron run</text>
  <text x="400" y="445" fill="#a08a5a" font-size="10" text-anchor="middle" font-family="sans-serif">token guarded</text>

  <text x="488" y="437" fill="#f59e0b" font-size="20" font-weight="bold" text-anchor="middle" font-family="sans-serif">&#8594;</text>

  <rect x="518" y="404" width="140" height="52" rx="8" fill="#2a1c05"/>
  <text x="588" y="428" fill="#fde68a" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">e-mail sent</text>
  <text x="588" y="445" fill="#a08a5a" font-size="10" text-anchor="middle" font-family="sans-serif">row marked once</text>

  <!-- Label area -->
  <rect x="0" y="525" width="800" height="75" fill="#161b22"/>
  <rect x="0" y="525" width="800" height="3" fill="#f59e0b"/>

  <text x="30" y="552" fill="#fffbeb" font-size="22" font-weight="bold" font-family="sans-serif">NovaKur Back in Stock Alerts</text>

  <rect x="680" y="535" width="90" height="30" rx="6" fill="#3a2708"/><text x="725" y="556" fill="#f59e0b" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">$29</text>

  <rect x="30" y="562" width="60" height="16" rx="4" fill="#f59e0b" opacity="0.15"/>
  <text x="60" y="574" fill="#f59e0b" font-size="9" font-weight="bold" text-anchor="middle" font-family="sans-serif">MODULE</text>
</svg>
