<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Grid lines -->
  <line x1="0" y1="0" x2="0" y2="600" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="67" y1="0" x2="67" y2="600" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="134" y1="0" x2="134" y2="600" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="201" y1="0" x2="201" y2="600" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="268" y1="0" x2="268" y2="600" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="335" y1="0" x2="335" y2="600" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="402" y1="0" x2="402" y2="600" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="469" y1="0" x2="469" y2="600" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="536" y1="0" x2="536" y2="600" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="603" y1="0" x2="603" y2="600" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="670" y1="0" x2="670" y2="600" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="737" y1="0" x2="737" y2="600" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="0" y1="0" x2="800" y2="0" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="0" y1="67" x2="800" y2="67" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="0" y1="134" x2="800" y2="134" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="0" y1="201" x2="800" y2="201" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="0" y1="268" x2="800" y2="268" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="0" y1="335" x2="800" y2="335" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="0" y1="402" x2="800" y2="402" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="0" y1="469" x2="800" y2="469" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="0" y1="536" x2="800" y2="536" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>

  <!-- Glow orb -->
  <circle cx="400" cy="250" r="200" fill="#10b981" opacity="0.06" filter="url(#glow)"/>

  <!-- Module preview illustration: the option block of a product page -->
  <rect x="150" y="120" width="500" height="265" rx="12" fill="#0d2d24" stroke="#10b981" stroke-width="1.5"/>

  <!-- Before: the stock dropdown -->
  <text x="175" y="155" fill="#6ee7b7" font-size="11" font-weight="bold" font-family="sans-serif">COLOUR</text>
  <rect x="175" y="165" width="200" height="30" rx="4" fill="#0a1f17" stroke="#1a3a2a" stroke-width="1"/>
  <text x="187" y="185" fill="#4b6b5d" font-size="11" font-family="sans-serif">--- Please Select ---</text>
  <path d="M 356 176 l 6 7 l 6 -7" fill="none" stroke="#4b6b5d" stroke-width="2" stroke-linecap="round"/>

  <!-- Arrow -->
  <path d="M 400 180 L 440 180" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  <path d="M 433 174 L 440 180 L 433 186" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- After: swatches -->
  <circle cx="480" cy="180" r="14" fill="#d32f2f" stroke="#ffffff" stroke-width="2"/>
  <circle cx="520" cy="180" r="14" fill="#1e88e5" stroke="#ffffff" stroke-width="2"/>
  <circle cx="560" cy="180" r="14" fill="#fbc02d" stroke="#ffffff" stroke-width="2"/>
  <circle cx="600" cy="180" r="14" fill="#8e24aa" stroke="#ffffff" stroke-width="2"/>

  <!-- Selected ring -->
  <circle cx="520" cy="180" r="18" fill="none" stroke="#10b981" stroke-width="2.5"/>

  <!-- Out of stock, struck through -->
  <circle cx="640" cy="180" r="14" fill="#455a64" stroke="#ffffff" stroke-width="2" opacity="0.55"/>
  <line x1="628" y1="192" x2="652" y2="168" stroke="#0a1f17" stroke-width="3" stroke-linecap="round"/>
  <line x1="628" y1="192" x2="652" y2="168" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Value labels under the swatches -->
  <text x="480" y="212" fill="#6ee7b7" font-size="9" text-anchor="middle" font-family="sans-serif">Red</text>
  <text x="520" y="212" fill="#f0fdf4" font-size="9" font-weight="bold" text-anchor="middle" font-family="sans-serif">Blue</text>
  <text x="560" y="212" fill="#6ee7b7" font-size="9" text-anchor="middle" font-family="sans-serif">Amber</text>
  <text x="600" y="212" fill="#6ee7b7" font-size="9" text-anchor="middle" font-family="sans-serif">Plum</text>
  <text x="640" y="212" fill="#4b6b5d" font-size="9" text-anchor="middle" font-family="sans-serif">Slate</text>

  <!-- The hidden field that keeps working -->
  <rect x="175" y="240" width="450" height="34" rx="4" fill="#0a1f17" stroke="#1a3a2a" stroke-width="1"/>
  <text x="190" y="262" fill="#6ee7b7" font-size="11" font-family="monospace">&lt;select name="option[225]"&gt; &#8594; value = 1115</text>
  <circle cx="600" cy="257" r="8" fill="#10b981" opacity="0.2"/>
  <path d="M 596 257 l 3 3 l 6 -7" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Add to cart still works -->
  <rect x="175" y="292" width="140" height="34" rx="4" fill="#10b981"/>
  <text x="245" y="314" fill="#062f21" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">Add to Cart</text>
  <text x="330" y="314" fill="#6ee7b7" font-size="11" font-family="sans-serif">untouched &#8212; no core edits</text>

  <!-- Card strip preview -->
  <text x="175" y="358" fill="#4b6b5d" font-size="10" font-family="sans-serif">Category cards:</text>
  <circle cx="285" cy="354" r="7" fill="#d32f2f"/>
  <circle cx="303" cy="354" r="7" fill="#1e88e5"/>
  <circle cx="321" cy="354" r="7" fill="#fbc02d"/>
  <circle cx="339" cy="354" r="7" fill="#8e24aa"/>
  <text x="360" y="358" fill="#4b6b5d" font-size="10" font-family="sans-serif">+3</text>

  <!-- Label area -->
  <rect x="0" y="525" width="800" height="75" fill="#161b22"/>
  <rect x="0" y="525" width="800" height="3" fill="#10b981"/>

  <text x="30" y="552" fill="#f0fdf4" font-size="22" font-weight="bold" font-family="sans-serif">NovaKur Color Swatches</text>

  <rect x="680" y="535" width="90" height="30" rx="6" fill="#1a3a2a"/><text x="725" y="556" fill="#10b981" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">$29</text>

  <rect x="30" y="562" width="60" height="16" rx="4" fill="#10b981" opacity="0.15"/>
  <text x="60" y="574" fill="#10b981" font-size="9" font-weight="bold" text-anchor="middle" font-family="sans-serif">MODULE</text>

  <text x="105" y="574" fill="#4b6b5d" font-size="10" font-family="sans-serif">Visual option swatches with out-of-stock strikethrough</text>
</svg>
