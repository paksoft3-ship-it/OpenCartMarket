<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Grid lines -->
  <line x1="0" y1="0" x2="0" y2="600" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="67" y1="0" x2="67" y2="600" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="134" y1="0" x2="134" y2="600" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="201" y1="0" x2="201" y2="600" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="268" y1="0" x2="268" y2="600" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="335" y1="0" x2="335" y2="600" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="402" y1="0" x2="402" y2="600" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="469" y1="0" x2="469" y2="600" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="536" y1="0" x2="536" y2="600" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="603" y1="0" x2="603" y2="600" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="670" y1="0" x2="670" y2="600" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="737" y1="0" x2="737" y2="600" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="0" y1="0" x2="800" y2="0" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="0" y1="67" x2="800" y2="67" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="0" y1="134" x2="800" y2="134" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="0" y1="201" x2="800" y2="201" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="0" y1="268" x2="800" y2="268" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="0" y1="335" x2="800" y2="335" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="0" y1="402" x2="800" y2="402" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="0" y1="469" x2="800" y2="469" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>

  <!-- Glow orb -->
  <circle cx="400" cy="250" r="200" fill="#10b981" opacity="0.06" filter="url(#glow)"/>

  <!-- Stage timeline: abandoned cart -> three reminders -> recovered order -->
  <text x="70" y="112" fill="#7b8794" font-size="11" font-weight="bold" letter-spacing="1.5" font-family="sans-serif">RECOVERY SERIES</text>
  <line x1="120" y1="150" x2="680" y2="150" stroke="#1a3a2a" stroke-width="2"/>

  <!-- Node: abandoned -->
  <circle cx="120" cy="150" r="13" fill="#0a1f17" stroke="#7b8794" stroke-width="2"/>
  <path d="M114 146 h3 l2 8 h7" stroke="#7b8794" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <circle cx="121" cy="157" r="1.4" fill="#7b8794"/>
  <circle cx="126" cy="157" r="1.4" fill="#7b8794"/>
  <text x="120" y="184" fill="#9aa5b1" font-size="11" text-anchor="middle" font-family="sans-serif">Abandoned</text>

  <!-- Node: 1h -->
  <circle cx="260" cy="150" r="13" fill="#0d2d24" stroke="#10b981" stroke-width="2"/>
  <rect x="254" y="146" width="12" height="8" rx="1.5" fill="none" stroke="#10b981" stroke-width="1.4"/>
  <path d="M254 146.5 l6 4.5 l6 -4.5" fill="none" stroke="#10b981" stroke-width="1.4"/>
  <text x="260" y="184" fill="#10b981" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">1 h</text>

  <!-- Node: 24h -->
  <circle cx="400" cy="150" r="13" fill="#0d2d24" stroke="#10b981" stroke-width="2"/>
  <rect x="394" y="146" width="12" height="8" rx="1.5" fill="none" stroke="#10b981" stroke-width="1.4"/>
  <path d="M394 146.5 l6 4.5 l6 -4.5" fill="none" stroke="#10b981" stroke-width="1.4"/>
  <text x="400" y="184" fill="#10b981" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">24 h</text>

  <!-- Node: 72h + coupon -->
  <circle cx="540" cy="150" r="13" fill="#0d2d24" stroke="#10b981" stroke-width="2"/>
  <rect x="534" y="146" width="12" height="8" rx="1.5" fill="none" stroke="#10b981" stroke-width="1.4"/>
  <path d="M534 146.5 l6 4.5 l6 -4.5" fill="none" stroke="#10b981" stroke-width="1.4"/>
  <text x="540" y="184" fill="#10b981" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">72 h + coupon</text>

  <!-- Node: recovered -->
  <circle cx="680" cy="150" r="15" fill="#10b981"/>
  <path d="M673 150 l5 5 l9 -10" stroke="#0d1117" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="680" y="186" fill="#f0fdf4" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">Recovered</text>

  <!-- Recovery e-mail preview -->
  <rect x="120" y="222" width="300" height="200" rx="10" fill="#0d2d24" stroke="#10b981" stroke-width="1.5"/>
  <rect x="120" y="222" width="300" height="34" rx="10" fill="#0a1f17"/>
  <rect x="120" y="246" width="300" height="10" fill="#0a1f17"/>
  <circle cx="137" cy="239" r="4" fill="#10b981" opacity="0.5"/>
  <text x="152" y="243" fill="#7b8794" font-size="10" font-family="sans-serif">Your cart is still waiting</text>

  <rect x="138" y="272" width="52" height="52" rx="4" fill="#0a1f17"/>
  <rect x="202" y="274" width="130" height="9" rx="2" fill="#1a3a2a"/>
  <rect x="202" y="290" width="96" height="7" rx="2" fill="#1a3a2a"/>
  <rect x="202" y="305" width="60" height="7" rx="2" fill="#1a3a2a"/>

  <line x1="138" y1="338" x2="402" y2="338" stroke="#1a3a2a" stroke-width="1"/>
  <text x="138" y="358" fill="#7b8794" font-size="10" font-family="sans-serif">Total</text>
  <text x="402" y="358" fill="#f0fdf4" font-size="11" font-weight="bold" text-anchor="end" font-family="sans-serif">$318.00</text>

  <rect x="138" y="372" width="120" height="26" rx="4" fill="#0a1f17" stroke="#10b981" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="198" y="389" fill="#10b981" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">COMEBACK10</text>
  <rect x="272" y="372" width="130" height="26" rx="4" fill="#10b981"/>
  <text x="337" y="389" fill="#0d1117" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">Return to my cart</text>

  <!-- Admin dashboard preview -->
  <rect x="450" y="222" width="230" height="200" rx="10" fill="#0d2d24" stroke="#10b981" stroke-width="1.5"/>
  <text x="468" y="248" fill="#7b8794" font-size="10" font-weight="bold" letter-spacing="1" font-family="sans-serif">DASHBOARD</text>

  <rect x="468" y="260" width="90" height="52" rx="5" fill="#0a1f17"/>
  <text x="480" y="278" fill="#7b8794" font-size="8" font-family="sans-serif">PENDING</text>
  <text x="480" y="298" fill="#f0fdf4" font-size="17" font-weight="bold" font-family="sans-serif">25</text>

  <rect x="572" y="260" width="90" height="52" rx="5" fill="#0a1f17"/>
  <text x="584" y="278" fill="#7b8794" font-size="8" font-family="sans-serif">RECOVERED</text>
  <text x="584" y="298" fill="#10b981" font-size="17" font-weight="bold" font-family="sans-serif">$1,842</text>

  <rect x="468" y="326" width="194" height="9" rx="2" fill="#1a3a2a"/>
  <rect x="468" y="344" width="150" height="7" rx="2" fill="#1a3a2a"/>
  <rect x="630" y="343" width="32" height="9" rx="4" fill="#10b981" opacity="0.85"/>
  <rect x="468" y="362" width="150" height="7" rx="2" fill="#1a3a2a"/>
  <rect x="630" y="361" width="32" height="9" rx="4" fill="#7b8794" opacity="0.5"/>
  <rect x="468" y="380" width="150" height="7" rx="2" fill="#1a3a2a"/>
  <rect x="630" y="379" width="32" height="9" rx="4" fill="#10b981" opacity="0.85"/>
  <rect x="468" y="398" width="150" height="7" rx="2" fill="#1a3a2a"/>
  <rect x="630" y="397" width="32" height="9" rx="4" fill="#7b8794" opacity="0.5"/>

  <!-- Label area -->
  <rect x="0" y="525" width="800" height="75" fill="#161b22"/>
  <rect x="0" y="525" width="800" height="3" fill="#10b981"/>

  <text x="30" y="552" fill="#f0fdf4" font-size="22" font-weight="bold" font-family="sans-serif">NovaKur Abandoned Cart Recovery</text>

  <rect x="680" y="535" width="90" height="30" rx="6" fill="#1a3a2a"/><text x="725" y="556" fill="#10b981" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">$49</text>

  <rect x="30" y="562" width="60" height="16" rx="4" fill="#10b981" opacity="0.15"/>
  <text x="60" y="574" fill="#10b981" font-size="9" font-weight="bold" text-anchor="middle" font-family="sans-serif">MODULE</text>
</svg>
