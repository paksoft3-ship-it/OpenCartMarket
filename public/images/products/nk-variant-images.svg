<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Grid lines -->
  <line x1="0" y1="0" x2="0" y2="600" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="67" y1="0" x2="67" y2="600" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="134" y1="0" x2="134" y2="600" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="201" y1="0" x2="201" y2="600" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="268" y1="0" x2="268" y2="600" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="335" y1="0" x2="335" y2="600" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="402" y1="0" x2="402" y2="600" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="469" y1="0" x2="469" y2="600" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="536" y1="0" x2="536" y2="600" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="603" y1="0" x2="603" y2="600" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="670" y1="0" x2="670" y2="600" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="737" y1="0" x2="737" y2="600" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="0" y1="0" x2="800" y2="0" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="0" y1="67" x2="800" y2="67" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="0" y1="134" x2="800" y2="134" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="0" y1="201" x2="800" y2="201" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="0" y1="268" x2="800" y2="268" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="0" y1="335" x2="800" y2="335" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="0" y1="402" x2="800" y2="402" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="0" y1="469" x2="800" y2="469" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="0" y1="536" x2="800" y2="536" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>

  <!-- Glow orb -->
  <circle cx="400" cy="250" r="200" fill="#10b981" opacity="0.06" filter="url(#glow)"/>

  <!-- Module preview illustration: the product gallery reacting to an option -->
  <rect x="120" y="115" width="560" height="275" rx="12" fill="#0d2d24" stroke="#10b981" stroke-width="1.5"/>

  <!-- Main image -->
  <rect x="140" y="135" width="200" height="170" rx="6" fill="#0a1f17" stroke="#1a3a2a" stroke-width="1"/>
  <circle cx="205" cy="195" r="26" fill="#1e88e5"/>
  <path d="M 155 285 L 210 215 L 255 265 L 285 235 L 325 285 Z" fill="#1565c0"/>
  <rect x="140" y="135" width="200" height="170" rx="6" fill="none" stroke="#10b981" stroke-width="1.5"/>

  <!-- Thumbnail strip, all blue -->
  <rect x="140" y="315" width="44" height="44" rx="4" fill="#1565c0" stroke="#10b981" stroke-width="1.5"/>
  <rect x="192" y="315" width="44" height="44" rx="4" fill="#1e88e5" stroke="#1a3a2a" stroke-width="1"/>
  <rect x="244" y="315" width="44" height="44" rx="4" fill="#0d47a1" stroke="#1a3a2a" stroke-width="1"/>
  <rect x="296" y="315" width="44" height="44" rx="4" fill="#42a5f5" stroke="#1a3a2a" stroke-width="1"/>

  <!-- Arrow from the option to the gallery -->
  <path d="M 430 220 L 370 220" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  <path d="M 377 214 L 370 220 L 377 226" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Option control -->
  <text x="450" y="155" fill="#6ee7b7" font-size="11" font-weight="bold" font-family="sans-serif">COLOUR</text>

  <rect x="450" y="168" width="210" height="34" rx="4" fill="#0a1f17" stroke="#1a3a2a" stroke-width="1"/>
  <circle cx="470" cy="185" r="9" fill="#d32f2f"/>
  <text x="490" y="190" fill="#4b6b5d" font-size="12" font-family="sans-serif">Red</text>

  <rect x="450" y="206" width="210" height="34" rx="4" fill="#0a1f17" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="470" cy="223" r="9" fill="#1e88e5"/>
  <text x="490" y="228" fill="#f0fdf4" font-size="12" font-weight="bold" font-family="sans-serif">Blue</text>
  <path d="M 634 222 l 5 5 l 10 -11" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="450" y="244" width="210" height="34" rx="4" fill="#0a1f17" stroke="#1a3a2a" stroke-width="1"/>
  <circle cx="470" cy="261" r="9" fill="#fbc02d"/>
  <text x="490" y="266" fill="#4b6b5d" font-size="12" font-family="sans-serif">Amber</text>

  <!-- Mapping line -->
  <rect x="450" y="296" width="210" height="64" rx="6" fill="#0a1f17" stroke="#1a3a2a" stroke-width="1"/>
  <text x="464" y="318" fill="#6ee7b7" font-size="10" font-family="monospace">Blue &#8594; 4 images</text>
  <rect x="464" y="328" width="24" height="20" rx="3" fill="#1565c0"/>
  <rect x="494" y="328" width="24" height="20" rx="3" fill="#1e88e5"/>
  <rect x="524" y="328" width="24" height="20" rx="3" fill="#0d47a1"/>
  <rect x="554" y="328" width="24" height="20" rx="3" fill="#42a5f5"/>
  <text x="592" y="343" fill="#4b6b5d" font-size="9" font-family="sans-serif">mapped</text>

  <!-- Label area -->
  <rect x="0" y="525" width="800" height="75" fill="#161b22"/>
  <rect x="0" y="525" width="800" height="3" fill="#10b981"/>

  <text x="30" y="552" fill="#f0fdf4" font-size="22" font-weight="bold" font-family="sans-serif">NovaKur Variant Images</text>

  <rect x="680" y="535" width="90" height="30" rx="6" fill="#1a3a2a"/><text x="725" y="556" fill="#10b981" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">$29</text>

  <rect x="30" y="562" width="60" height="16" rx="4" fill="#10b981" opacity="0.15"/>
  <text x="60" y="574" fill="#10b981" font-size="9" font-weight="bold" text-anchor="middle" font-family="sans-serif">MODULE</text>

  <text x="105" y="574" fill="#4b6b5d" font-size="10" font-family="sans-serif">Gallery switches to the images mapped to the chosen option</text>
</svg>
