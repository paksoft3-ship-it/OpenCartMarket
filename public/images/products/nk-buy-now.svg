<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Grid lines -->
  <line x1="0" y1="0" x2="0" y2="600" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="67" y1="0" x2="67" y2="600" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="134" y1="0" x2="134" y2="600" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="201" y1="0" x2="201" y2="600" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="268" y1="0" x2="268" y2="600" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="335" y1="0" x2="335" y2="600" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="402" y1="0" x2="402" y2="600" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="469" y1="0" x2="469" y2="600" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="536" y1="0" x2="536" y2="600" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="603" y1="0" x2="603" y2="600" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="670" y1="0" x2="670" y2="600" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="737" y1="0" x2="737" y2="600" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="0" y1="0" x2="800" y2="0" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="0" y1="67" x2="800" y2="67" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="0" y1="134" x2="800" y2="134" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="0" y1="201" x2="800" y2="201" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="0" y1="268" x2="800" y2="268" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="0" y1="335" x2="800" y2="335" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="0" y1="402" x2="800" y2="402" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="0" y1="469" x2="800" y2="469" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="0" y1="536" x2="800" y2="536" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>

  <!-- Glow orb -->
  <circle cx="400" cy="250" r="200" fill="#10b981" opacity="0.06" filter="url(#glow)"/>

  <!-- Module preview illustration: product page buy box -->
  <rect x="150" y="125" width="500" height="255" rx="12" fill="#0d2d24" stroke="#10b981" stroke-width="1.5"/>

  <!-- product image placeholder -->
  <rect x="168" y="143" width="150" height="150" rx="6" fill="#0a1f17"/>
  <circle cx="212" cy="188" r="14" fill="#1a3a2a"/>
  <path d="M180 275 L226 218 L262 254 L288 232 L306 275 Z" fill="#1a3a2a"/>

  <!-- title + price -->
  <rect x="336" y="143" width="220" height="16" rx="3" fill="#0a1f17"/>
  <rect x="336" y="169" width="120" height="9" rx="2" fill="#1a3a2a"/>
  <text x="336" y="207" fill="#10b981" font-size="24" font-weight="bold" font-family="sans-serif">$49.00</text>

  <!-- qty + add to cart + buy now (the module) -->
  <rect x="336" y="225" width="46" height="30" rx="4" fill="#0a1f17" stroke="#1a3a2a" stroke-width="1"/>
  <text x="359" y="245" fill="#6ee7b7" font-size="11" text-anchor="middle" font-family="sans-serif">1</text>

  <rect x="388" y="225" width="104" height="30" rx="4" fill="#1a3a2a"/>
  <text x="440" y="245" fill="#6ee7b7" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">Add to Cart</text>

  <rect x="498" y="225" width="118" height="30" rx="4" fill="#f59e0b"/>
  <text x="561" y="245" fill="#111111" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">⚡ Buy Now</text>

  <!-- flow: buy now skips the cart, straight to checkout -->
  <rect x="336" y="278" width="118" height="26" rx="4" fill="#0a1f17" stroke="#1a3a2a" stroke-width="1"/>
  <text x="395" y="295" fill="#3f6b58" font-size="9" text-anchor="middle" font-family="sans-serif">Cart page</text>
  <line x1="352" y1="303" x2="438" y2="279" stroke="#ef4444" stroke-width="1.5" opacity="0.8"/>

  <rect x="498" y="278" width="118" height="26" rx="4" fill="#10b981"/>
  <text x="557" y="295" fill="#052e1c" font-size="9" font-weight="bold" text-anchor="middle" font-family="sans-serif">Checkout</text>

  <path d="M470 240 C 486 240, 486 291, 494 291" stroke="#f59e0b" stroke-width="2" fill="none" opacity="0.9" stroke-dasharray="4 3"/>
  <path d="M488 286 L497 291 L488 296 Z" fill="#f59e0b"/>

  <text x="336" y="336" fill="#6ee7b7" font-size="11" font-family="sans-serif">One click — options and quantity preserved</text>
  <text x="336" y="356" fill="#3f6b58" font-size="10" font-family="sans-serif">Required-option errors stay inline, no redirect</text>

  <!-- Label area -->
  <rect x="0" y="525" width="800" height="75" fill="#161b22"/>
  <rect x="0" y="525" width="800" height="3" fill="#10b981"/>

  <text x="30" y="552" fill="#f0fdf4" font-size="22" font-weight="bold" font-family="sans-serif">NovaKur Buy Now Button</text>

  <rect x="680" y="535" width="90" height="30" rx="6" fill="#1a3a2a"/><text x="725" y="556" fill="#10b981" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">$19</text>

  <rect x="30" y="562" width="60" height="16" rx="4" fill="#10b981" opacity="0.15"/>
  <text x="60" y="574" fill="#10b981" font-size="9" font-weight="bold" text-anchor="middle" font-family="sans-serif">MODULE</text>
</svg>
