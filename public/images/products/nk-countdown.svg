<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Grid lines -->
  <line x1="0" y1="0" x2="0" y2="600" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="67" y1="0" x2="67" y2="600" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="134" y1="0" x2="134" y2="600" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="201" y1="0" x2="201" y2="600" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="268" y1="0" x2="268" y2="600" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="335" y1="0" x2="335" y2="600" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="402" y1="0" x2="402" y2="600" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="469" y1="0" x2="469" y2="600" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="536" y1="0" x2="536" y2="600" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="603" y1="0" x2="603" y2="600" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="670" y1="0" x2="670" y2="600" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="737" y1="0" x2="737" y2="600" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="0" y1="0" x2="800" y2="0" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="0" y1="67" x2="800" y2="67" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="0" y1="134" x2="800" y2="134" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="0" y1="201" x2="800" y2="201" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="0" y1="268" x2="800" y2="268" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="0" y1="335" x2="800" y2="335" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="0" y1="402" x2="800" y2="402" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="0" y1="469" x2="800" y2="469" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>
  <line x1="0" y1="536" x2="800" y2="536" stroke="#10b981" stroke-width="0.2" opacity="0.15"/>

  <!-- Glow orb -->
  <circle cx="400" cy="250" r="200" fill="#10b981" opacity="0.06" filter="url(#glow)"/>

  <!-- Sitewide campaign bar -->
  <rect x="120" y="112" width="560" height="46" rx="6" fill="#111827" stroke="#1a3a2a" stroke-width="1"/>
  <text x="196" y="141" fill="#f0fdf4" font-size="12" font-weight="bold" font-family="sans-serif">Summer sale ends in</text>
  <g font-family="sans-serif" text-anchor="middle">
    <rect x="356" y="122" width="52" height="26" rx="4" fill="#0a1f17"/>
    <text x="382" y="140" fill="#10b981" font-size="13" font-weight="bold">02</text>
    <rect x="416" y="122" width="52" height="26" rx="4" fill="#0a1f17"/>
    <text x="442" y="140" fill="#10b981" font-size="13" font-weight="bold">11</text>
    <rect x="476" y="122" width="52" height="26" rx="4" fill="#0a1f17"/>
    <text x="502" y="140" fill="#10b981" font-size="13" font-weight="bold">45</text>
    <rect x="536" y="122" width="52" height="26" rx="4" fill="#0a1f17"/>
    <text x="562" y="140" fill="#10b981" font-size="13" font-weight="bold">09</text>
  </g>

  <!-- Product page card with the special timer -->
  <rect x="150" y="186" width="500" height="215" rx="12" fill="#0d2d24" stroke="#10b981" stroke-width="1.5"/>

  <rect x="168" y="204" width="140" height="140" rx="6" fill="#0a1f17"/>
  <circle cx="208" cy="244" r="13" fill="#1a3a2a"/>
  <path d="M180 328 L222 274 L256 308 L280 288 L296 328 Z" fill="#1a3a2a"/>

  <rect x="326" y="204" width="200" height="15" rx="3" fill="#0a1f17"/>
  <text x="326" y="250" fill="#3f6b58" font-size="14" font-family="sans-serif" text-decoration="line-through">$79.00</text>
  <text x="398" y="250" fill="#10b981" font-size="20" font-weight="bold" font-family="sans-serif">$49.00</text>

  <!-- the special-ends-in block -->
  <rect x="326" y="266" width="300" height="60" rx="5" fill="#170f14" stroke="#dc2626" stroke-width="1.2"/>
  <text x="338" y="286" fill="#dc2626" font-size="10" font-weight="bold" font-family="sans-serif">SPECIAL OFFER ENDS IN</text>
  <g font-family="sans-serif" text-anchor="middle">
    <text x="360" y="311" fill="#f87171" font-size="16" font-weight="bold">01</text>
    <text x="360" y="322" fill="#7f5257" font-size="7">DAYS</text>
    <text x="428" y="311" fill="#f87171" font-size="16" font-weight="bold">06</text>
    <text x="428" y="322" fill="#7f5257" font-size="7">HOURS</text>
    <text x="496" y="311" fill="#f87171" font-size="16" font-weight="bold">23</text>
    <text x="496" y="322" fill="#7f5257" font-size="7">MINS</text>
    <text x="564" y="311" fill="#f87171" font-size="16" font-weight="bold">18</text>
    <text x="564" y="322" fill="#7f5257" font-size="7">SECS</text>
  </g>

  <rect x="326" y="340" width="150" height="30" rx="4" fill="#10b981"/>
  <text x="401" y="360" fill="#052e1c" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">Add to Cart</text>

  <text x="150" y="428" fill="#6ee7b7" font-size="11" font-family="sans-serif">Deadline read from the product's real special end date — never invented</text>
  <text x="150" y="448" fill="#3f6b58" font-size="10" font-family="sans-serif">Static wording for prefers-reduced-motion · hides itself at zero</text>

  <!-- Label area -->
  <rect x="0" y="525" width="800" height="75" fill="#161b22"/>
  <rect x="0" y="525" width="800" height="3" fill="#10b981"/>

  <text x="30" y="552" fill="#f0fdf4" font-size="22" font-weight="bold" font-family="sans-serif">NovaKur Countdown Timer</text>

  <rect x="680" y="535" width="90" height="30" rx="6" fill="#1a3a2a"/><text x="725" y="556" fill="#10b981" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">$19</text>

  <rect x="30" y="562" width="60" height="16" rx="4" fill="#10b981" opacity="0.15"/>
  <text x="60" y="574" fill="#10b981" font-size="9" font-weight="bold" text-anchor="middle" font-family="sans-serif">MODULE</text>
</svg>
