  <rect x="556" y="231" width="120" height="15" rx="3" fill="#0f2a20"/>
  <text x="564" y="242" fill="#3f7f66" font-size="9" font-family="monospace">seo_url</text>

  <!-- Progress bar -->
  <rect x="110" y="312" width="580" height="16" rx="8" fill="#0a1f17"/>
  <rect x="110" y="312" width="400" height="16" rx="8" fill="#10b981"/>
  <text x="118" y="350" fill="#6ee7b7" font-size="11" font-family="sans-serif">Chunked import — 4,000 / 5,800 rows</text>
  <rect x="560" y="340" width="130" height="18" rx="4" fill="#1a3a2a"/>
  <text x="625" y="353" fill="#10b981" font-size="9" font-weight="bold" text-anchor="middle" font-family="sans-serif">DRY RUN PASSED</text>

  <!-- Feature chips -->
  <rect x="90" y="420" width="150" height="34" rx="8" fill="#0d2d24" stroke="#10b981" stroke-width="1"/>
  <text x="165" y="442" fill="#6ee7b7" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">Column mapping</text>
  <rect x="256" y="420" width="130" height="34" rx="8" fill="#0d2d24" stroke="#10b981" stroke-width="1"/>
  <text x="321" y="442" fill="#6ee7b7" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">Dry run</text>
  <rect x="402" y="420" width="150" height="34" rx="8" fill="#0d2d24" stroke="#10b981" stroke-width="1"/>
  <text x="477" y="442" fill="#6ee7b7" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">UTF-8 + BOM</text>
  <rect x="568" y="420" width="142" height="34" rx="8" fill="#0d2d24" stroke="#10b981" stroke-width="1"/>
  <text x="639" y="442" fill="#6ee7b7" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">No timeouts</text>

  <!-- Label area -->
  <rect x="0" y="525" width="800" height="75" fill="#161b22"/>
  <rect x="0" y="525" width="800" height="3" fill="#10b981"/>

  <text x="30" y="552" fill="#f0fdf4" font-size="22" font-weight="bold" font-family="sans-serif">NovaKur Import / Export Pro</text>

  <rect x="680" y="535" width="90" height="30" rx="6" fill="#1a3a2a"/>
  <text x="725" y="556" fill="#10b981" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">$39</text>

  <rect x="30" y="562" width="60" height="16" rx="4" fill="#10b981" opacity="0.15"/>
  <text x="60" y="574" fill="#10b981" font-size="9" font-weight="bold" text-anchor="middle" font-family="sans-serif">MODULE</text>
