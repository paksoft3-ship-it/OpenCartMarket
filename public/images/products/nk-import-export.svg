  <text x="122" y="155" fill="#6ee7b7" font-size="10" font-weight="bold" font-family="monospace">products.csv</text>
  <rect x="120" y="172" width="60" height="8" rx="2" fill="#1a3a2a"/>
  <rect x="190" y="172" width="70" height="8" rx="2" fill="#1a3a2a"/>
  <rect x="270" y="172" width="60" height="8" rx="2" fill="#1a3a2a"/>
  <rect x="120" y="192" width="60" height="8" rx="2" fill="#153025"/>
  <rect x="190" y="192" width="70" height="8" rx="2" fill="#153025"/>
  <rect x="270" y="192" width="60" height="8" rx="2" fill="#153025"/>
  <rect x="120" y="212" width="60" height="8" rx="2" fill="#153025"/>
  <rect x="190" y="212" width="70" height="8" rx="2" fill="#153025"/>
  <rect x="270" y="212" width="60" height="8" rx="2" fill="#153025"/>
  <rect x="120" y="232" width="60" height="8" rx="2" fill="#153025"/>
  <rect x="190" y="232" width="70" height="8" rx="2" fill="#153025"/>
  <rect x="270" y="232" width="60" height="8" rx="2" fill="#153025"/>
  <rect x="120" y="252" width="60" height="8" rx="2" fill="#153025"/>
  <rect x="190" y="252" width="70" height="8" rx="2" fill="#153025"/>
  <rect x="270" y="252" width="60" height="8" rx="2" fill="#153025"/>

  <!-- Mapping arrows -->
  <path d="M352 178 L392 178" stroke="#10b981" stroke-width="2"/>
  <path d="M352 208 L392 208" stroke="#10b981" stroke-width="2"/>
  <path d="M352 238 L392 238" stroke="#10b981" stroke-width="2"/>
  <polygon points="392,174 400,178 392,182" fill="#10b981"/>
  <polygon points="392,204 400,208 392,212" fill="#10b981"/>
  <polygon points="392,234 400,238 392,242" fill="#10b981"/>

  <!-- Right: OpenCart fields -->
  <rect x="408" y="140" width="282" height="150" rx="6" fill="#0a1f17"/>
  <rect x="408" y="140" width="282" height="22" rx="6" fill="#123a2c"/>
  <text x="420" y="155" fill="#6ee7b7" font-size="10" font-weight="bold" font-family="monospace">oc_product</text>
  <rect x="420" y="171" width="120" height="15" rx="3" fill="#153025"/>
  <text x="428" y="182" fill="#6ee7b7" font-size="9" font-family="monospace">model</text>
  <rect x="420" y="201" width="120" height="15" rx="3" fill="#153025"/>
  <text x="428" y="212" fill="#6ee7b7" font-size="9" font-family="monospace">name</text>
  <rect x="420" y="231" width="120" height="15" rx="3" fill="#153025"/>
  <text x="428" y="242" fill="#6ee7b7" font-size="9" font-family="monospace">price</text>
